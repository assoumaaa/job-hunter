[tool.poetry]
name = "job-hunter-backend"
version = "0.1.0"
description = "Job Hunter FastAPI backend"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.137.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"
pydantic = { extras = ["email"], version = "^2.0.0" }
pydantic-settings = "^2.0.0"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
anthropic = "^0.40.0"
apify-client = "^1.8.0"
httpx = "^0.27.0"
python-multipart = "^0.0.31"
weasyprint = "^69.0"
pymupdf = "^1.24.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# Line length is enforced by the formatter, not the linter; prompt/HTML string
# literals legitimately run long.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults on
# purpose — they are not mutable-default footguns, so B008 must allow them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]
